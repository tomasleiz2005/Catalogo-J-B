    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    
    <style>
        /* RESET PARA EVITAR ERRORES DE DISEÑO ANTERIORES */
        * { box-sizing: border-box; }
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            overflow-x: hidden !important;
            background: #001219;
        }

        /* FONDO FIJO */
        .background-fix {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("Patagonia.jpg");
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .main-box {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }

        /* HEADER */
        .new-header {
            background: rgba(10, 25, 41, 0.95);
            border-radius: 0 0 20px 20px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .new-header img {
            width: 90px;
            border-radius: 50%;
            border: 2px solid #34adf3;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-style {
            background: #34adf3;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* BIENVENIDA */
        .text-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
            color: #333;
        }

        /* CARRUSEL */
        .carousel {
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .carousel-inner img {
            height: 200px !important;
            width: 100%;
            object-fit: contain;
            background: #000;
        }

        /* GRILLA DE BOTONES (2 columnas en móvil, 4 en PC) */
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 40px;
        }

        @media (min-width: 768px) {
            .brands-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .brand-item {
            background: white;
            border-radius: 12px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            text-decoration: none !important;
        }

        .brand-item:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.2); }
        .brand-item:active { transform: scale(0.95); }

        .brand-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
